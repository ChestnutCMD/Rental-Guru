<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>FCM Test - RentalGuru</title>
</head>
<body>
  <h1>Получение FCM токена</h1>
  <button id="get-token">Получить токен</button>
  <pre id="output"></pre>

  <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-messaging-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAVFtJ9isbDXFaLbmJJcDdpMA8jsl_ZyOU",
      authDomain: "rental-guru-465d7.firebaseapp.com",
      projectId: "rental-guru-465d7",
      storageBucket: "rental-guru-465d7.appspot.com",
      messagingSenderId: "274995950667",
      appId: "1:274995950667:web:e3872098a2b49116acc9ce",
      measurementId: "G-K2WEZKWG2W"
    };

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    async function requestPermissionAndGetToken() {
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          document.getElementById('output').textContent = 'Уведомления не разрешены пользователем.';
          return;
        }

        const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        const token = await messaging.getToken({
          vapidKey: 'BKKf7beRVHddoNDzr3XwDSNyJyZD_cD3_IrvANTsxLv3rA068b4vfy81JWbwUv4Iaz5DSXQ5ufKqa9J49pSablk',
          serviceWorkerRegistration: registration
        });

        document.getElementById('output').textContent = 'FCM токен:\n' + token;
      } catch (err) {
        console.error('Ошибка получения токена:', err);
        document.getElementById('output').textContent = 'Ошибка: ' + err.message;
      }
    }

    document.getElementById('get-token').addEventListener('click', requestPermissionAndGetToken);

    messaging.onMessage(payload => {
      console.log('FCM сообщение получено:', payload);
      alert(`Уведомление: ${payload.notification?.title}\n${payload.notification?.body}`);
    });
  </script>
</body>
</html>
