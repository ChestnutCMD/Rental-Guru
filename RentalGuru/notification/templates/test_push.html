<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- ... (остальные мета-теги и стили остаются без изменений) ... -->
</head>
<body>
  <!-- ... (остальная разметка без изменений) ... -->

  <script>
    // ... (конфиг Firebase и инициализация без изменений) ...

    // Новая функция проверки состояния уведомлений
    async function checkNotificationPermission() {
      if (Notification.permission === 'granted') {
        return true;
      }

      // Edge часто не показывает запрос, если ранее было отклонено
      if (Notification.permission === 'denied') {
        log('Разрешение было ранее отклонено. Очистите настройки сайта в Edge.', true);
        statusEl.textContent = 'Разрешение отклонено. Очистите настройки сайта.';
        return false;
      }

      // Специальная обработка для Edge
      const isEdge = navigator.userAgent.includes('Edg/');
      if (isEdge) {
        log('Обнаружен браузер Edge. Применяем специальную обработку...');

        // В Edge сначала нужно открыть запрос разрешения отдельно
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          log('Разрешение не получено в Edge', true);
          return false;
        }

        // Даем время браузеру обработать разрешение
        await new Promise(resolve => setTimeout(resolve, 500));
      }

      return true;
    }

    // Обновленная функция получения токена
    async function getFCMToken() {
      try {
        // Проверяем поддержку браузера
        if (!checkBrowserSupport()) return;

        // Проверяем разрешения (с учетом особенностей Edge)
        if (!(await checkNotificationPermission())) return;

        log('Регистрация Service Worker...');
        const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js', {
          scope: '/',
          updateViaCache: 'none' // Важно для Edge
        });

        // Ждем активации Service Worker (особенно важно для Edge)
        await new Promise((resolve, reject) => {
          if (registration.active) {
            resolve();
          } else {
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'activated') {
                  resolve();
                }
              });
            });

            // Таймаут для Edge
            setTimeout(() => {
              if (registration.active) {
                resolve();
              } else {
                reject(new Error('Service Worker не активировался вовремя'));
              }
            }, 3000);
          }
        });

        log('Получение FCM токена...');
        const token = await messaging.getToken({
          vapidKey: vapidKey,
          serviceWorkerRegistration: registration
        });

        if (!token) {
          throw new Error('Токен не получен (пустой ответ)');
        }

        log('FCM токен успешно получен');
        tokenOutputEl.textContent = token;
        return token;
      } catch (error) {
        log(`Ошибка: ${error.message}`, true);

        // Специальная обработка для Edge
        if (error.message.includes('permission denied') ||
            error.message.includes('no active Service Worker')) {
          log('Попробуйте: 1) Открыть обычное окно (не приватное) 2) Очистить разрешения для сайта 3) Проверить блокировку трекеров', true);
        }

        return null;
      }
    }

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', () => {
      // ... (остальная инициализация без изменений) ...

      // Для Edge добавляем проверку приватного режима
      const isPrivateMode = () => {
        try {
          localStorage.setItem('test', 'test');
          localStorage.removeItem('test');
          return false;
        } catch (e) {
          return true;
        }
      };

      if (isPrivateMode()) {
        log('Внимание: Приватный режим может ограничивать работу уведомлений', true);
      }
    });
  </script>
</body>
</html>
