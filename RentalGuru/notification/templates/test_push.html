<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase FCM Token Test</title>
</head>
<body>
    <h1>Firebase FCM Token Test</h1>
    <button id="get-token">Get FCM Token</button>
    <p id="token"></p>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-app-compat.js"></script>
    <!-- Firebase Messaging -->
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-messaging-compat.js"></script>

    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
              apiKey: "AIzaSyAVFtJ9isbDXFaLbmJJcDdpMA8jsl_ZyOU",
              authDomain: "rental-guru-465d7.firebaseapp.com",
              projectId: "rental-guru-465d7",
              storageBucket: "rental-guru-465d7.firebasestorage.app",
              messagingSenderId: "274995950667",
              appId: "1:274995950667:web:e3872098a2b49116acc9ce",
              measurementId: "G-K2WEZKWG2W"
            };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Retrieve Firebase Messaging object
        const messaging = firebase.messaging();

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/firebase-messaging-sw.js')
                .then((registration) => {
                    console.log('Service Worker registered with scope:', registration.scope);

                    document.getElementById('get-token').addEventListener('click', async () => {
                        try {
                            const permission = await Notification.requestPermission();
                            if (permission === 'granted') {
                                const token = await messaging.getToken({ vapidKey: 'BKKf7beRVHddoNDzr3XwDSNyJyZD_cD3_IrvANTsxLv3rA068b4vfy81JWbwUv4Iaz5DSXQ5ufKqa9J49pSablk', serviceWorkerRegistration: registration });
                                if (token) {
                                    console.log('FCM Token:', token);
                                    document.getElementById('token').innerText = 'FCM Token: ' + token;
                                } else {
                                    console.error('No registration token available. Request permission to generate one.');
                                    document.getElementById('token').innerText = 'No registration token available. Request permission to generate one.';
                                }
                            } else {
                                console.error('Notification permission not granted');
                                document.getElementById('token').innerText = 'Notification permission not granted';
                            }
                        } catch (error) {
                            console.error('Error getting FCM token:', error);
                            document.getElementById('token').innerText = 'Error getting FCM token: ' + error;
                        }
                    });
                })
                .catch((error) => {
                    console.error('Service Worker registration failed:', error);
                });
        }

        // Handle incoming messages (optional)
        messaging.onMessage((payload) => {
            console.log('Message received. ', payload);
            // Customize your notification here
        });
    </script>
</body>
</html>
