<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCM Test - RentalGuru</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      line-height: 1.6;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #3367d6; }
    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
    }
    .error { color: #d32f2f; }
    .success { color: #388e3c; }
    #loading {
      display: none;
      margin: 10px 0;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Тестирование FCM уведомлений</h1>

  <div id="app">
    <p id="status">Проверка поддержки браузера...</p>

    <div id="controls" style="display: none;">
      <button id="request-permission">Разрешить уведомления</button>
      <button id="get-token" disabled>Получить FCM токен</button>
    </div>

    <div id="loading">Загрузка...</div>

    <h2>Токен:</h2>
    <pre id="token-output">Токен появится здесь</pre>

    <h2>Логи:</h2>
    <pre id="logs"></pre>
  </div>

  <!-- Fallback для случаев, когда скрипты не загрузились -->
  <noscript>
    <p class="error">Для работы этого приложения требуется JavaScript. Пожалуйста, включите JavaScript в настройках браузера.</p>
  </noscript>

  <script>
    // Минимальная проверка ошибок перед выполнением основного кода
    window.addEventListener('error', function(event) {
      document.getElementById('status').textContent = 'Произошла ошибка: ' + event.message;
      document.getElementById('status').className = 'error';
      console.error('Global error:', event.error);
    });

    // Основной код приложения
    document.addEventListener('DOMContentLoaded', function() {
      const statusEl = document.getElementById('status');
      const tokenOutputEl = document.getElementById('token-output');
      const logsEl = document.getElementById('logs');
      const controlsEl = document.getElementById('controls');
      const loadingEl = document.getElementById('loading');

      // Функция для добавления логов
      function log(message, isError = false) {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = document.createElement('div');
        logEntry.textContent = `[${timestamp}] ${message}`;
        logEntry.className = isError ? 'error' : '';
        logsEl.appendChild(logEntry);
        logsEl.scrollTop = logsEl.scrollHeight;
        console.log(message);
      }

      // Проверка поддержки необходимых API
      function checkSupport() {
        try {
          if (!('serviceWorker' in navigator)) {
            throw new Error('Service Worker не поддерживается');
          }

          if (!('PushManager' in window)) {
            throw new Error('Push API не поддерживается');
          }

          if (!('Notification' in window)) {
            throw new Error('Notifications API не поддерживается');
          }

          return true;
        } catch (error) {
          statusEl.textContent = error.message;
          statusEl.className = 'error';
          log(error.message, true);
          return false;
        }
      }

      // Инициализация Firebase
      function initializeFirebase() {
        try {
          log('Инициализация Firebase...');

          // Проверяем, загружены ли скрипты Firebase
          if (typeof firebase === 'undefined') {
            throw new Error('Библиотеки Firebase не загрузились');
          }

          const firebaseConfig = {
            apiKey: "AIzaSyAVFtJ9isbDXFaLbmJJcDdpMA8jsl_ZyOU",
            authDomain: "rental-guru-465d7.firebaseapp.com",
            projectId: "rental-guru-465d7",
            storageBucket: "rental-guru-465d7.appspot.com",
            messagingSenderId: "274995950667",
            appId: "1:274995950667:web:e3872098a2b49116acc9ce",
            measurementId: "G-K2WEZKWG2W"
          };

          const app = firebase.initializeApp(firebaseConfig);
          const messaging = firebase.messaging(app);

          log('Firebase инициализирован успешно');
          return { messaging };
        } catch (error) {
          log('Ошибка инициализации Firebase: ' + error.message, true);
          throw error;
        }
      }

      // Основная функция инициализации
      async function initializeApp() {
        try {
          // Проверяем поддержку браузера
          if (!checkSupport()) return;

          // Инициализируем Firebase
          const { messaging } = initializeFirebase();

          // Показываем элементы управления
          controlsEl.style.display = 'block';
          statusEl.textContent = 'Готово к работе';
          statusEl.className = '';

          // Обработчики кнопок
          document.getElementById('request-permission').addEventListener('click', () => requestPermission(messaging));
          document.getElementById('get-token').addEventListener('click', () => getFCMToken(messaging));

          // Проверяем текущее состояние разрешений
          updatePermissionUI();

        } catch (error) {
          statusEl.textContent = 'Ошибка инициализации: ' + error.message;
          statusEl.className = 'error';
          log('Критическая ошибка: ' + error.message, true);
        }
      }

      // Обновляем UI в соответствии с текущими разрешениями
      function updatePermissionUI() {
        const permissionBtn = document.getElementById('request-permission');
        const tokenBtn = document.getElementById('get-token');

        if (Notification.permission === 'granted') {
          permissionBtn.textContent = 'Уведомления разрешены';
          permissionBtn.disabled = true;
          tokenBtn.disabled = false;
        } else if (Notification.permission === 'denied') {
          permissionBtn.textContent = 'Уведомления заблокированы';
          permissionBtn.disabled = true;
          tokenBtn.disabled = true;
        } else {
          permissionBtn.textContent = 'Разрешить уведомления';
          permissionBtn.disabled = false;
          tokenBtn.disabled = true;
        }
      }

      // Запрос разрешения на уведомления
      async function requestPermission(messaging) {
        try {
          loadingEl.style.display = 'block';
          log('Запрос разрешения на уведомления...');

          const permission = await Notification.requestPermission();
          log(`Результат запроса разрешения: ${permission}`);

          updatePermissionUI();

          if (permission !== 'granted') {
            throw new Error('Пользователь отклонил разрешение');
          }

          log('Разрешение на уведомления получено');
          statusEl.textContent = 'Уведомления разрешены';
          statusEl.className = 'success';

        } catch (error) {
          log('Ошибка запроса разрешения: ' + error.message, true);
          statusEl.textContent = 'Ошибка: ' + error.message;
          statusEl.className = 'error';
        } finally {
          loadingEl.style.display = 'none';
        }
      }

      // Получение FCM токена
      async function getFCMToken(messaging) {
        try {
          loadingEl.style.display = 'block';
          log('Начало получения FCM токена...');

          // Проверяем разрешения
          if (Notification.permission !== 'granted') {
            throw new Error('Нет разрешения на уведомления');
          }

          // Регистрируем Service Worker
          log('Регистрация Service Worker...');
          const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js', {
            scope: '/',
            updateViaCache: 'none'
          });

          log('Ожидание активации Service Worker...');
          await waitForServiceWorkerActivation(registration);

          log('Получение FCM токена...');
          const token = await messaging.getToken({
            vapidKey: 'BKKf7beRVHddoNDzr3XwDSNyJyZD_cD3_IrvANTsxLv3rA068b4vfy81JWbwUv4Iaz5DSXQ5ufKqa9J49pSablk',
            serviceWorkerRegistration: registration
          });

          if (!token) {
            throw new Error('Пустой токен');
          }

          log('FCM токен успешно получен');
          tokenOutputEl.textContent = token;
          statusEl.textContent = 'Токен получен!';
          statusEl.className = 'success';

          return token;

        } catch (error) {
          log('Ошибка получения токена: ' + error.message, true);
          statusEl.textContent = 'Ошибка: ' + error.message;
          statusEl.className = 'error';

          // Специальная обработка для Edge
          if (error.message.includes('no active Service Worker') ||
              error.message.includes('permission denied')) {
            log('Совет для Edge: 1) Используйте обычное окно (не приватное) 2) Очистите разрешения для сайта 3) Отключите блокировщики', true);
          }

          return null;
        } finally {
          loadingEl.style.display = 'none';
        }
      }

      // Ожидание активации Service Worker
      function waitForServiceWorkerActivation(registration) {
        return new Promise((resolve, reject) => {
          if (registration.active) {
            log('Service Worker уже активен');
            return resolve();
          }

          const timeout = setTimeout(() => {
            reject(new Error('Таймаут активации Service Worker'));
          }, 5000);

          registration.addEventListener('updatefound', () => {
            const installingWorker = registration.installing;
            installingWorker.addEventListener('statechange', () => {
              if (installingWorker.state === 'activated') {
                clearTimeout(timeout);
                log('Service Worker активирован');
                resolve();
              } else if (installingWorker.state === 'redundant') {
                clearTimeout(timeout);
                reject(new Error('Service Worker стал избыточным'));
              }
            });
          });
        });
      }

      // Запускаем приложение
      initializeApp();
    });
  </script>
</body>
</html>
